<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>

        <div id="timer_container">

            
            <label for="set_time">Enter time in seconds:</label>
            <input id="time-input" type="number" placeholder="Enter time in seconds">
            <div id="time_display"><p>00:00:00</p></div>
            <div id="button_container">
                <button class="button" id="start_button">Start</button>
                <button class="button" id="pause_button">Pause</button>
                <button class="button" id="reset_button">Reset</button>
            </div>
        </div>

    </main>

    <script type="module" src="script.js"></script>
    
</body>
</html>
