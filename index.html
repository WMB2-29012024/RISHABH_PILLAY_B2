<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>

    <main>
        <h1>Sign Up</h1> 
        <br>
        <form id="sign_up_form" action="">

        </form>
    </main>






    <script src="script.js"></script>
</body>
