<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <nav>
            <h2 class="logo">Logo Here</h2>

            <div class="nav-button-container">
                <a href="">Home</a>
                <a href="">Features </a>
                <a href="">Blog</a>
                <a href="">Shop</a>
                <a href="">About</a>
                <a href="">Contact</a>
                <div></div>
                <div class="user-profile">
                    <img src="Mask group.svg" alt="">
                </div>
                <div class="user-cart">
                    <img src="bi_cart.svg" alt="">
                </div>
            </div>



        </nav>

        <div class="container">

            <div class="contectUs">
                <h1>Contact us</h1>
                <p>Any question or remarks? Just write us a message!</p>

            </div>

            <div class="contact-information-container">
                <div class="contact-information">

                    <div>
                        <h3>Contact Information</h3>
                        <p><span></span>Say something to start a live chat!</p>
                    </div>

                    <p><span><img src="Vector.svg" alt=""></span><span>+1012 3456 789</span></p>
                    <p><span><img src="Vector (1).svg" alt=""></span><span>demo@gmail.com</span></p>
                    <p><span><img src="Vector (2).svg" alt=""></span><span>132 Dartmouth Street Boston, Massachusetts 02156 United States</span></p>

                    <div class="social-media-container">
                        <div class="social-media">
                            <img src="Vector (3).svg" alt="">
                        </div>
                        <div class="social-media">
                            <img src="Vector (4).svg" alt="">
                        </div>
                        <div class="social-media">
                            <img src="Vector (5).svg" alt="">
                        </div>                  
                    </div>


                    
                    
                    












                </div>
                <div class="contactUs-form-container">
                    <form class="contactUs-form" action="">

                        <div class="userName">
                            <div class="user-firstName">
                                <label for="user-firstName-input"> First Name</label>
                                <input id="user-firstName-input" type="text">
                            </div>
                            <div class="user-lastName">
                                <label for="user-lastName-input"> Last Name</label>
                                <input id="user-lastName-input" type="text">
                            </div>
                        </div>

                        <div class="user-contact">

                            <div class="user-email">
                                <label for="user-email-input"> Email</label>
                                <input id="user-email-input" type="text">
                            </div>
                            <div class="user-phoneNumber">
                                <label for="user-phoneNumber-input"> Phone Number</label>
                                <input id="user-phoneNumber-input" type="text">
                            </div>

                        </div>

                        <div class="selectSubject-conatiner">


                            <h3>Select Subject?</h3>

                            <div class="radio-container">
                                <input type="radio" id="input-radio" name="Subject" checked>
                                <label for="input-radio">General Inquiry</label>

                                <input type="radio" id="input-radio" name="Subject">
                                <label for="input-radio">General Inquiry</label>

                                <input type="radio" id="input-radio" name="Subject">
                                <label for="input-radio">General Inquiry</label>

                                <input type="radio" id="input-radio" name="Subject">
                                <label for="input-radio">General Inquiry</label>
                            </div>
                        </div>

                        <div class="add-message-container">
                            <label for="add-message">Message</label>
                            <input id="add-message" type="text">
                        </div>

                        <div class="sendMessage-button-container">
                            <button class="sendMessage-button">
                                Send Message
                            </button>
                        </div>

                    </form>



                </div>





            </div>

            





        </div>




    </main>

    <script src="script.js"></script>
</body>

</html>
