<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Upload Preview with Progress Bar</title>
  <style>
    #preview {
      max-width: 300px;
      max-height: 300px;
      margin-top: 20px;
    }

    #progressBar {
      width: 100%;
      height: 20px;
      background-color: #f0f0f0;
      margin-top: 10px;
      overflow: hidden;
    }

    #progressBar .progress {
      height: 100%;
      background-color: #4caf50;
      width: 0%;
      transition: width 0.3s ease;
    }
  </style>
</head>

<body>
  <input type="file" id="imageInput" accept="image/*">
  <div id="imagePreview">
    <img id="preview" src="#" alt="Image Preview">
  </div>
  <div id="progressBar">
    <div class="progress" id="progress"></div>
  </div>

  <script>
    // Get reference to the input and image element
    const imageInput = document.getElementById('imageInput');
    const imagePreview = document.getElementById('preview');
    const progressBar = document.getElementById('progress');
    const progressBarContainer = document.getElementById('progressBar');
    // Add event listener for when a file is selected
    imageInput.addEventListener('change', function() {
      const file = this.files[0]; // Get the selected file
      
      if (file) {
        const reader = new FileReader(); // Initialize a FileReader object
        reader.onprogress = function(e) {
          // Update the progress bar based on FileReader's progress event
          if (e.lengthComputable) {
            const progress = (e.loaded / e.total) * 100;
            progressBar.style.width = `${progress}%`;
          }
        };
        reader.onload = function(e) {
          // Set the source of the image element to the result of FileReader
          imagePreview.src = e.target.result;
          // Reset the progress bar after loading is complete
          setTimeout(() => {
            progressBar.style.width = '0%'
          }, 2000)
        };
        // Read the selected file as a Data URL
        reader.readAsDataURL(file);
      } else {
        // If no file is selected, display a default image
        imagePreview.src = '#';
        // Reset the progress bar
        progressBar.style.width = '0%';
      }
    });
  </script>
</body>

</html>
